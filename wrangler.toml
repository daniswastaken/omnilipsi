name = "omnilipsi"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*" ]

[vars]
# Universal extraction backend (real yt-dlp, handles TikTok/IG/X/obscure sites).
# Deploy ./extractor (Render/Fly/Docker, free tiers work), then set:
# EXTRACTOR_API_URL = "https://your-extractor.onrender.com"
# and optionally: npx wrangler secret put EXTRACTOR_TOKEN
# Legacy alternative: COBALT_API_URL = "https://cobalt-api.yourdomain.com"
# (+ secret COBALT_API_KEY).

[observability]
enabled = true
